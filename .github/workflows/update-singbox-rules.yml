name: 自动更新 sing-box 规则

on:
  push:
    branches: [main]
    paths:
      - mihomo/rules/PT.list
      - mihomo/rules/giffgaff.list
      - mihomo/rules/Direct.list
      - mihomo/rules/Docker.list
      - mihomo/rules/Proxy.list
      - mihomo/rules/Claude.list
      - mihomo/rules/Grok.list
      - mihomo/rules/AI-other.list
      - mihomo/rules/byte-muse.list
      - sing-box/规则自动更新/**
      - sing-box/config/**
      - sing-box/rules/*.json
      - .github/workflows/update-singbox-rules.yml
  schedule:
    - cron: '47 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: singbox-rules-main
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      # GitHub requires this entry under .github/workflows; implementation lives in sing-box/规则自动更新.
      - name: 生成、校验并发布规则
        shell: bash
        env:
          REFRESH_UPSTREAM: ${{ github.event_name != 'push' }}
          GH_TOKEN: ${{ github.token }}
        run: bash "sing-box/规则自动更新/执行更新.sh"

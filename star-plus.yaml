# Star-plus.yaml
# 基于 Star.yaml + qichiyuhub/rule 的 Mihomo 防泄漏思路增强
# 重点：TUN DNS 劫持、IPv6 关闭、境外 DoH 强制走代理、Fake-IP 过滤规则集、私网直连、境外 QUIC/443 回退 TCP
# 保留：原订阅、策略组、分流规则、个人 chinahhy/clash-rules 规则集
# 注意：route-exclude-address-set 会绕过大陆 IP；已补 Google Play 常见例外。
proxy-providers:
  SakuraCat-QQ邮箱77:
    url: "*****"
    type: http
    interval: 86400
    filter: "^(?!.*(剩余|5倍|套餐)).*$"
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 直连
    path: "./proxy_provider/SakuraCat-QQ邮箱77"
  SakuraCat-hotmail:
    url: "*****"
    type: http
    interval: 86400
    filter: "^(?!.*(剩余|5倍|套餐)).*$"
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 直连
    path: "./proxy_provider/SakuraCat-hotmail"
  顺畅网络-QQ邮箱:
    url: "*****"
    type: http
    interval: 86400
    filter: "^(?!.*(更新订阅|刷新)).*$"
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 直连
    path: "./proxy_provider/顺畅网络-QQ邮箱"
proxies:
  - name: 直连
    type: direct
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
find-process-mode: 'off'
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
disable-keep-alive: false
profile:
  store-selected: true
  store-fake-ip: true
# 防泄漏核心：接管系统流量并劫持 UDP/TCP 53 DNS。
# 未强制 strict-route，避免在 OpenClash 路由器环境里与现有防火墙规则打架。
tun:
  enable: true
  stack: mixed
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  route-exclude-address-set:
    - cn_ip
sniffer:
  enable: true
  override-destination: false
  force-dns-mapping: false
  sniff:
    QUIC:
      ports:
        - 443
        - 8443
    TLS:
      ports:
        - 443
        - 8443
    HTTP:
      ports:
        - 80
        - 8080-8880
  force-domain:
    - "+.netflix.com"
    - "+.nflxvideo.net"
    - "+.amazonaws.com"
    - "+.media.dssott.com"
  skip-domain:
    - Mijia Cloud
    - dlg.io.mi.com
    - "+.oray.com"
    - "+.sunlogin.net"
    - "+.push.apple.com"
  parse-pure-ip: true
# DNS 防泄漏：国内/直连域名用国内 DoH；其余默认经“DNS代理”访问 Google/Cloudflare DoH。
# respect-rules=true + proxy-server-nameserver 避免代理节点域名解析出现鸡蛋问题。
dns:
  enable: true
  listen: 0.0.0.0:7874
  cache-algorithm: arc
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-ttl: 1
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  use-hosts: true
  default-nameserver:
    - "https://223.5.5.5/dns-query"
  proxy-server-nameserver:
    - "https://dns.alidns.com/dns-query"
    - "https://doh.pub/dns-query"
  direct-nameserver:
    - "https://dns.alidns.com/dns-query"
    - "https://doh.pub/dns-query"
  nameserver-policy:
    rule-set:cn_domain,private_domain,fakeipfilter_cn,direct_domain,pt_domain,apple_domain:
      - "https://dns.alidns.com/dns-query#disable-qtype-65=true"
      - "https://doh.pub/dns-query#disable-qtype-65=true"
    +.googleapis.cn:
      - "https://8.8.8.8/dns-query#DNS代理&disable-qtype-65=true"
    +.xn--ngstr-lra8j.com:
      - "https://8.8.8.8/dns-query#DNS代理&disable-qtype-65=true"
    rule-set:fakeipfilter_!cn:
      - "https://8.8.8.8/dns-query#DNS代理&disable-qtype-65=true"
      - "https://1.1.1.1/dns-query#DNS代理&disable-qtype-65=true"
    rule-set:youtube_domain:
      - "https://8.8.8.8/dns-query#DNS代理&disable-qtype-65=true"
  nameserver:
    - "https://8.8.8.8/dns-query#DNS代理&disable-qtype-65=true"
    - "https://1.1.1.1/dns-query#DNS代理&disable-qtype-65=true"
  fallback:
    - "https://8.8.8.8/dns-query#DNS代理&disable-qtype-65=true"
    - "https://1.1.1.1/dns-query#DNS代理&disable-qtype-65=true"
  fallback-filter:
    geoip: true
    geoip-code: CN
  fake-ip-filter:
    - rule-set:fakeipfilter_cn
    - rule-set:fakeipfilter_!cn

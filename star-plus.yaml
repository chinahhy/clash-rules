# 防泄漏优先规则：Twitter/X 优先放行 QUIC；其余境外 UDP/443 继续拒绝以强制回落 TCP。
rules:
  - "RULE-SET,twitter_domain,🦀 Twitter"
  - "RULE-SET,twitter_ip,🦀 Twitter,no-resolve"
  - AND,((RULE-SET,geolocation-!cn),(DST-PORT,443),(NETWORK,UDP)),REJECT
  - RULE-SET,private_ip,直连,no-resolve
  - DOMAIN-SUFFIX,googleapis.cn,🍀 Google
  - DOMAIN-SUFFIX,xn--ngstr-lra8j.com,🍀 Google
  - IP-CIDR,10.0.0.0/24,DIRECT,no-resolve
  - "RULE-SET,pt_domain,👹 PT"
  - "RULE-SET,direct_domain,🕸️ Direct"
  - "RULE-SET,giffgaff_domain,💠 GiffGaff"
  - "RULE-SET,whatsapp_domain,📞 Whatsapp"
  - "RULE-SET,docker_domain,🚢 Docker"
  - "RULE-SET,chatgpt_domain,🫆 ChatGPT"
  - "RULE-SET,claude_domain,👒 ClaudeCode"
  - "RULE-SET,gemini_domain,🧢 Gemini"
  - "RULE-SET,grok_domain,🧶 Grok"
